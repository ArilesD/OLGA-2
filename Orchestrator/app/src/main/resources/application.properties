# Port du serveur. Peut être surchargé via la variable d'environnement SERVER_PORT.
server.port=${SERVER_PORT:9092}

# URL du backend Olga. Peut être surchargée via la variable d'environnement
# OLGA_BACKEND_BASE_URL (utilisée par Docker pour pointer vers le service interne).
olga.backend.base-url=${OLGA_BACKEND_BASE_URL:http://localhost:9091}

# Documentation OpenAPI / Swagger (springdoc)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
